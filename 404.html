<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting — Haiku 5.5 Chat</title>
  <meta http-equiv="refresh" content="0; url=./index.html" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #131210;
      color: #f5f1ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: #e68868; text-decoration: none; }
  </style>
  <script>
    (function () {
      var path = window.location.pathname;
      var base = path.replace(/\/[^/]*$/, '/');
      window.location.replace(base + 'index.html');
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="./index.html">Haiku 5.5 Chat</a>…</p>
</body>
</html>
